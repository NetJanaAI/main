version: '3.8'

services:
  # NetJana Unified SaaS Container
  # This container includes both the UI and the API 
  app:
    image: netjana-scraper:latest
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: netjana-prod
    restart: always
    # Cloud providers like Azure/Render will map their public ports to this EXPOSEd 3000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVE_FRONTEND=true
      # Values should be provided via Cloud Provider dashboard secrets
      - DATABASE_URL=${PGBOUNCER_DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LITELLM_API_BASE=http://litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - HMAC_SECRET=${HMAC_SECRET}
      - ALLOWED_INGEST_IPS=${ALLOWED_INGEST_IPS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ROLE=api_only
      # STUB-04: Security Vault, Pull API, and Alerting keys
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - NETJANA_PULL_API_KEY=${NETJANA_PULL_API_KEY}
      - NETJANA_HMAC_SECRET=${NETJANA_HMAC_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
    volumes:
      # Data persistence for the Regional Vault
      - netjana_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Isolated Auto-Scaling Scraper Tier
  scraper-worker:
    image: netjana-scraper:latest
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: netjana-scraper-worker
    restart: always
    command: npm run start:scraper
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${PGBOUNCER_DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LITELLM_API_BASE=http://litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ROLE=worker
      # STUB-04: Security Vault and Alerting keys
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
    volumes:
      - netjana_data:/app/data

  # Dedicated Daemon for Webhook Delivery (Saves $ by separating from heavy Node Scraper)
  go-pusher:
    image: netjana-go-pusher:latest
    build: 
      context: ./go-pusher
      dockerfile: Dockerfile
    container_name: netjana-go-pusher-prod
    restart: always
    environment:
      - DATABASE_URL=${PGBOUNCER_DATABASE_URL}
      - CONVOSPAN_WEBHOOK_URL=${CONVOSPAN_WEBHOOK_URL}
      - CONVOSPAN_API_KEY=${CONVOSPAN_API_KEY}
      - NETJANA_HMAC_SECRET=${NETJANA_HMAC_SECRET}
      - PUSHER_MAX_RETRIES=5
      - PUSHER_TIMEOUT_SEC=15
    # P1-E Fix: Added healthcheck so Docker can detect crashes and auto-restart.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: netjana-pgbouncer-prod
    restart: always
    ports:
      - "6432:6432"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: netjana-litellm-prod
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - REDIS_URL=${REDIS_URL}

volumes:
  netjana_data:

# ─── NOTE ON REDIS PERSISTENCE (P0-4) ───────────────────────────────────────
# This prod compose uses REDIS_URL which should point to a managed Redis
# service (Upstash, Redis Cloud, AWS ElastiCache) where AOF/RDB persistence
# is handled by the provider.
#
# If self-hosting Redis alongside this compose, add:
#
#   redis:
#     image: redis:7-alpine
#     command: redis-server --appendonly yes --appendfsync everysec
#     volumes:
#       - redis_data:/data
#
# and add redis_data to the volumes block.
# ─────────────────────────────────────────────────────────────────────────────
