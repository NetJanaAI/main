version: '3.8'

services:
  app:
    build: .
    image: netjana-scraper:local
    container_name: b2b-scraper
    restart: unless-stopped
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
      - /root/.cache
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - DATABASE_URL=postgres://netjana:netjana@postgres:5432/netjana
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - COMPLIANCE_LEGAL_LLM_REQUIRED=${COMPLIANCE_LEGAL_LLM_REQUIRED:-false}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - HMAC_SECRET=${HMAC_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - ALLOWED_INGEST_IPS=${ALLOWED_INGEST_IPS:-127.0.0.1,::1}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - REGION_ID=UAE_DUBAI_01
      # ConvoSpan push + Outreach vars
      - CONVOSPAN_WEBHOOK_URL=${CONVOSPAN_WEBHOOK_URL}
      - CONVOSPAN_API_KEY=${CONVOSPAN_API_KEY}
      - NETJANA_HMAC_SECRET=${NETJANA_HMAC_SECRET}
      - NETJANA_PULL_API_KEY=${NETJANA_PULL_API_KEY}
      - OUTREACH_DEFAULT_EMAIL=${OUTREACH_DEFAULT_EMAIL}
      - ROLE=api_only
      # STUB-04: Security Vault and Alerting keys
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # S3-2: App-level health probe so Docker knows when the API is ready
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scraper-worker:
    build: .
    image: netjana-scraper:local
    container_name: b2b-scraper-worker
    restart: unless-stopped
    command: npm run start:scraper
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
      - /root/.cache
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgres://netjana:netjana@postgres:5432/netjana
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - COMPLIANCE_LEGAL_LLM_REQUIRED=${COMPLIANCE_LEGAL_LLM_REQUIRED:-false}
      - HMAC_SECRET=${HMAC_SECRET}
      - ALLOWED_INGEST_IPS=${ALLOWED_INGEST_IPS:-127.0.0.1,::1}
      - ROLE=worker
      - REGION_ID=UAE_DUBAI_01
      # STUB-04: Security Vault and Alerting keys
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  go-pusher:
    build: 
      context: ./go-pusher
      dockerfile: Dockerfile
    image: netjana-go-pusher:local
    container_name: b2b-go-pusher
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - DATABASE_URL=postgres://netjana:netjana@postgres:5432/netjana
      - CONVOSPAN_WEBHOOK_URL=${CONVOSPAN_WEBHOOK_URL}
      - CONVOSPAN_API_KEY=${CONVOSPAN_API_KEY}
      - NETJANA_HMAC_SECRET=${NETJANA_HMAC_SECRET}
      - PUSHER_MAX_RETRIES=5
      - PUSHER_TIMEOUT_SEC=15
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: b2b-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_USER: netjana
      POSTGRES_PASSWORD: netjana
      POSTGRES_DB: netjana
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Auto-run init.sql on first container start (idempotent migration)
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netjana -d netjana"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: b2b-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # P0-4 Fix: Enable AOF persistence so BullMQ job state survives container restarts.
    # appendfsync everysec is the recommended balance of durability vs. performance.
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  pg_data:
